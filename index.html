<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Shuttumanii ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #ffb6d9, #ffc8a2, #d9b8ff);
    text-align: center;
    color: #ff176b;
}

.screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px 15px;
}

#opening {
    transition: opacity 1s, transform 1s;
}

#opening h1 {
    font-size: clamp(25px, 6vw, 45px);
    color: white;
    text-shadow: 2px 3px 8px #ff4081;
    margin-bottom: 35px;
}

.heart-button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 120px;
    animation: heartbeat 1s infinite;
    filter: drop-shadow(0 0 20px #ff1744);
}

.tap-text {
    color: white;
    font-size: 22px;
    font-weight: bold;
    margin-top: 20px;
    animation: blink 1.2s infinite;
}

#lovePage {
    display: none;
    opacity: 0;
}

.love-title {
    font-size: clamp(35px, 8vw, 75px);
    font-weight: 900;
    line-height: 1.3;
    background: linear-gradient(
        90deg, #ff0055, #ff8c00, #ff00cc, #6200ff
    );
    background-size: 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbow 4s linear infinite, pop 1s ease;
    text-shadow: 0 0 20px #ffffff80;
}

.subtitle {
    font-size: clamp(20px, 4vw, 30px);
    color: white;
    margin: 15px 0;
    text-shadow: 2px 2px 5px #ff4081;
}

.couple {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 25px;
    margin-top: 35px;
    animation: pop 2s ease;
}

.character {
    width: 150px;
    height: 210px;
    position: relative;
    animation: bounce 2s infinite ease-in-out;
}

.bunny {
    animation-delay: 0.5s;
}

.head {
    width: 115px;
    height: 115px;
    border-radius: 50%;
    position: absolute;
    top: 35px;
    left: 17px;
    background: #f4a261;
    border: 4px solid white;
}

.bunny .head {
    background: #eee5ff;
}

.ear {
    position: absolute;
    width: 30px;
    height: 95px;
    border-radius: 50%;
    background: #f4a261;
    border: 4px solid white;
    top: -45px;
}

.bunny .ear {
    background: #eee5ff;
}

.ear.left {
    left: 20px;
    transform: rotate(-15deg);
}

.ear.right {
    right: 20px;
    transform: rotate(15deg);
}

.eye {
    position: absolute;
    width: 12px;
    height: 18px;
    background: #333;
    border-radius: 50%;
    top: 43px;
}

.eye.left { left: 28px; }
.eye.right { right: 28px; }

.nose {
    position: absolute;
    width: 15px;
    height: 10px;
    background: #ff6b9a;
    border-radius: 50%;
    top: 65px;
    left: 47px;
}

.body {
    width: 100px;
    height: 100px;
    position: absolute;
    bottom: 0;
    left: 25px;
    border-radius: 45% 45% 20% 20%;
    background: #e76f51;
    border: 4px solid white;
}

.bunny .body {
    background: #a78bfa;
}

.heart {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    font-size: 35px;
    animation: heartbeat 1s infinite;
}

.speech {
    background: white;
    color: #ff4081;
    padding: 12px 18px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: bold;
    max-width: 180px;
    margin: 20px auto 0;
    box-shadow: 0 5px 15px #ff408140;
    animation: float 3s infinite;
}

.floating-heart {
    position: fixed;
    bottom: -30px;
    font-size: 25px;
    pointer-events: none;
    animation: floatUp 5s linear forwards;
    z-index: 5;
}

.sound-controls {
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 10;
}

.sound-controls button {
    background: #ff4081;
    color: white;
    border: 2px solid white;
    border-radius: 25px;
    padding: 12px 18px;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 12px #ff408155;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

@keyframes blink {
    50% { opacity: 0.4; }
}

@keyframes rainbow {
    to { background-position: 300%; }
}

@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes float {
    50% { transform: translateY(-8px); }
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@media (max-width: 400px) {
    .character {
        transform: scale(0.8);
        margin: -10px;
    }

    .couple {
        gap: 5px;
    }
}
</style>
</head>

<body>

<section id="opening" class="screen">
    <h1>A Little Surprise For You 💌</h1>

    <button class="heart-button" onclick="openLove()">
        ❤️
    </button>

    <p class="tap-text">Tap to open 💕</p>
</section>

<section id="lovePage" class="screen">
    <h1 class="love-title">
        I Love You<br>
        Shuttumanii ❤️
    </h1>

    <p class="subtitle">You make my world beautiful! ✨</p>

    <div class="couple">

        <div>
            <div class="character fox">
                <div class="heart">💗</div>
                <div class="head">
                    <div class="ear left"></div>
                    <div class="ear right"></div>
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="nose"></div>
                </div>
                <div class="body"></div>
            </div>
            <div class="speech">You are my favorite! 🦊</div>
        </div>

        <div>
            <div class="character bunny">
                <div class="heart">💖</div>
                <div class="head">
                    <div class="ear left"></div>
                    <div class="ear right"></div>
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="nose"></div>
                </div>
                <div class="body"></div>
            </div>
            <div class="speech">Always and forever! 🐰</div>
        </div>

    </div>

    <p class="subtitle">Made with lots of love 💝</p>
</section>

<div class="sound-controls">
    <button onclick="toggleMusic()" id="musicBtn">
        🎵 Music: OFF
    </button>
</div>

<audio id="bgMusic" loop>
    <source src="romantic-music.mp3" type="audio/mpeg">
</audio>

<audio id="popSound" src="heart-pop.mp3"></audio>
<audio id="sparkleSound" src="sparkle.mp3"></audio>

<script>
const bgMusic = document.getElementById("bgMusic");
const popSound = document.getElementById("popSound");
const sparkleSound = document.getElementById("sparkleSound");

let heartsInterval;

function openLove() {
    const opening = document.getElementById("opening");
    const lovePage = document.getElementById("lovePage");

    // Play heart-pop sound
    popSound.currentTime = 0;
    popSound.play().catch(() => {});

    opening.style.opacity = "0";
    opening.style.transform = "scale(0.5)";

    setTimeout(() => {
        opening.style.display = "none";
        lovePage.style.display = "flex";
        lovePage.style.animation = "fadeIn 1.5s forwards";

        // Play sparkle sound
        sparkleSound.currentTime = 0;
        sparkleSound.play().catch(() => {});
    }, 700);

    createHearts();
}

function toggleMusic() {
    const musicBtn = document.getElementById("musicBtn");

    if (bgMusic.paused) {
        bgMusic.play().then(() => {
            musicBtn.innerHTML = "🎵 Music: ON";
        }).catch(() => {
            musicBtn.innerHTML = "🎵 Tap to play";
        });
    } else {
        bgMusic.pause();
        musicBtn.innerHTML = "🎵 Music: OFF";
    }
}

function createHearts() {
    if (heartsInterval) return;

    heartsInterval = setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "floating-heart";
        heart.innerHTML = ["❤️", "💖", "💕", "💗", "💘"][
            Math.floor(Math.random() * 5)
        ];

        heart.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
    }, 400);
}
</script>

</body>
</html>
